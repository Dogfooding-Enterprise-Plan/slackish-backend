server:
  port: 8080
  servlet:
    session:
      timeout: -1
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: jdbc:h2:mem:slackish;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: "slackish-demo-signing-key-please-change-0123456789abcdef"
  frontend-origin: "http://localhost:5173"

logging:
  level:
    org.springframework.security: INFO
